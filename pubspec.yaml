name: gestion_stock
description: "Application de gestion Stock & Personnel pour tablette."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.5.0

  # Dependency injection
  get_it: ^9.2.1

  # Formatage (dates, nombres, devise) + i18n
  intl: 0.20.2

  # Graphiques (tableau de bord, rapports)
  fl_chart: ^1.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
